id: code-change-zod-validation
skill: code-change
cwd: demos/inventory-svc
kinds:
- routing
- shape
prompt: PUT /stock/:sku accepts any body. Validate that qty is a non-negative integer.
expect:
  routes_to: code-change
  file_contains:
    src/server.ts:
    - zod|from \"zod\"
    - nonnegative|min\(0\)
  regex:
  - ADR-0003
  - '^Verify: '
  files_changed_max: 3
