apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
  labels: {app.kubernetes.io/name: ledger-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: ledger-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ledger-worker}
    spec:
      containers:
        - name: ledger-worker
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/ledger-worker:latest
          env:
            - {name: KAFKA_BOOTSTRAP, value: "b-1.payments.kafka.eu-west-1.amazonaws.com:9098"}
