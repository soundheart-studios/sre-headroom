id: incident-debug-kind-requests-fail
skill: incident-debug
cwd: demos/kind-lab
requires_context: kind-converged
kinds:
- routing
- shape
prompt: requests to the storefront service fail, but the pods look Running
expect:
  routes_to: incident-debug
  contains:
  - 'Likely cause:'
  regex:
  - readiness|/healthz
  max_prose_lines: 8
