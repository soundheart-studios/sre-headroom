apiVersion: apps/v1
kind: Deployment
metadata: {name: search-indexer, namespace: shop, labels: {app: search-indexer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: search-indexer}}
  template:
    metadata: {labels: {app: search-indexer}}
    spec:
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "48", memory: 64Mi}
