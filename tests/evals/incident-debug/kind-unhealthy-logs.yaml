id: incident-debug-kind-unhealthy-logs
skill: incident-debug
cwd: demos/kind-lab
requires_context: kind-converged
kinds:
- routing
- subagent
prompt: ledger-worker in shop looks unhealthy, check its logs
expect:
  routes_to: incident-debug
  subagent: log-analyst
  contains:
  - 'Likely cause:'
  contains_any:
  - - statement timeout
    - QueryCanceled
  not_regex:
  - waiting for (its|the)
